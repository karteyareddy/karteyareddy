<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile README preview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown.css">
<style>
  body { margin: 0; background: #0d1117; }
  body.light { background: #fff; }
  .wrap { max-width: 1012px; margin: 0 auto; padding: 24px 16px; }
  .markdown-body { border: 1px solid #30363d; border-radius: 6px; padding: 32px; }
  @media (max-width: 600px) { .markdown-body { padding: 16px; } }
  .bar { font: 13px system-ui; color: #8b949e; margin-bottom: 12px; }
  button { font: inherit; }
</style>
<div class="wrap">
  <div class="bar">Local preview, GitHub styling · <button id="t">toggle light/dark</button></div>
  <article id="md" class="markdown-body" data-theme="dark"></article>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  fetch('README.md?' + Date.now()).then(r => r.text()).then(t => {
    document.getElementById('md').innerHTML = marked.parse(t);
  });
  document.getElementById('t').onclick = () => {
    const a = document.getElementById('md');
    const light = a.dataset.theme === 'dark';
    a.dataset.theme = light ? 'light' : 'dark';
    a.style.colorScheme = light ? 'light' : 'dark';
    document.body.classList.toggle('light', light);
  };
</script>
