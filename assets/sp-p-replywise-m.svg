<svg xmlns="http://www.w3.org/2000/svg" width="600" height="709" viewBox="0 0 600 709" role="img" aria-labelledby="t"><title id="t">ReplyWise Local — A local-first WhatsApp CRM that drafts replies with per-contact memory, and sends nothing until you approve it. Built with Node.js, Express, whatsapp-web.js, Gemini / Groq, Docker.</title><defs><linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="780" y1="0" x2="1150" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#4F7DFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="gf" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="420" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#4F7DFF"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient></defs><style>.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.draft{animation:dash 6s linear infinite}@keyframes dash{to{stroke-dashoffset:-110}}</style><rect x=".5" y=".5" width="599" height="708" rx="18" fill="#0A0C10" stroke="#1E2633"/><path d="M40 .5H420" stroke="url(#gf)" stroke-width="2"/><text x="40" y="70" class="m" font-size="17" letter-spacing="3" fill="#22D3EE" font-weight="700">P/03</text><text x="40" y="98" class="m" font-size="15" letter-spacing="2" fill="#5D6678">LLMS × MESSAGING</text><text x="38" y="150" class="s" font-size="46" font-weight="700" fill="#E8ECF4" letter-spacing="-.5">ReplyWise Local</text><text x="40" y="186" class="s" font-size="23" fill="#9AA3B5">A local-first WhatsApp CRM that drafts replies</text><text x="40" y="219" class="s" font-size="23" fill="#9AA3B5">with per-contact memory, and sends nothing until</text><text x="40" y="252" class="s" font-size="23" fill="#9AA3B5">you approve it.</text><rect x="40.0" y="293" width="93.0" height="3