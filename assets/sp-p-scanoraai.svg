peatCount="indefinite"/></linearGradient><linearGradient id="gc" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="740" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="0.35" stop-color="#4C8DFF"/><stop offset="0.7" stop-color="#A855F7"/><stop offset="1" stop-color="#FF3DA6"/></linearGradient><linearGradient id="gf" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="420" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="0.35" stop-color="#4C8DFF"/><stop offset="0.7" stop-color="#A855F7"/><stop offset="1" stop-color="#FF3DA6" stop-opacity="0"/></linearGradient></defs><style>.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.08}50%{opacity:.85}}.dr1,.dr2,.dr3{transform-box:fill-box;transform-origin:center}.dr1{animation:dr1 16s ease-in-out infinite alternate}@keyframes dr1{to{transform:translate(110px,50px) scale(1.2)}}.dr2{animation:dr2 21s ease-in-out infinite alternate}@keyframes dr2{to{transform:translate(-140px,40px) scale(1.1)}}.dr3{animation:dr3 18s ease-in-out infinite alternate}@keyframes dr3{to{transform:translate(70px,-70px) scale(.85)}}.scan{animation:scan 7s linear infinite}@keyframes scan{to{transform:translateX(1700px)}}.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 4.4s ease-out infinite}@keyframes ring{0%{opacity:.8;transform:scale(.4)}60%,100%{opacity:0;transform:scale(1.7)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity: