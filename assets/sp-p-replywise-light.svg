<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t"><title id="t">ReplyWise Local — A local-first WhatsApp CRM that drafts replies with per-contact memory, and sends nothing until you approve it. Built with Node.js, Express, whatsapp-web.js, Gemini / Groq, Docker.</title><defs><clipPath id="pc"><rect x="1" y="1" width="1198" height="328" rx="18"/></clipPath><filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter><filter id="ng" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#1E293B" opacity=".09"/></pattern><linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E293B" stop-opacity="0"/><stop offset=".5" stop-color="#1E293B" stop-opacity=".045"/><stop offset="1" stop-color="#1E293B" stop-opacity="0"/></linearGradient><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="54" y1="0" x2="700" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#0891B2"/><stop offset="0.35" stop-color="#2563EB"/><stop offset="0.7" stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;323 0;0 0" dur="7s" repeatCount="indefinite"/></linearGradient><linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="780" y1="0" x2="1150" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#0891B2"/><stop offset="0.35" stop-color="#2563EB"/><stop offset="0.7" stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;185 0;0 0" dur="7s" repeatCount="indefinite"/></linearGradient><linearGradient id="gc" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="740" y2="0"><stop offset="0" stop-color="#0891B2"/><stop offset="0.35" stop-color="#2563EB"/><stop offset="0.7" stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777"/></linearGradient><linearGradient id="gf" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="420" y2="0"><stop offset="0" stop-color="#0891B2"/><stop offset="0.35" stop-color="#2563EB"/><stop offset="0.7" stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777" stop-opacity="0"/></linearGradient></defs><style>.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.08}50%{opacity:.85}}.dr1,.dr2,.dr3{transform-box:fill-box;transform-origin:center}.dr1{animation:dr1 16s ease-in-out infinite alternate}@keyframes dr1{to{transform:translate(110px,50px) scale(1.2)}}.dr2{animation:dr2 21s ease-in-out infinite alternate}@keyframes dr2{to{transform:translate(-140px,40px) scale(1.1)}}.dr3{animation:dr3 18s ease-in-out infinite alternate}@keyframes dr3{to{transform:translate(70px,-70px) scale(.85)}}.scan{animation:scan 7s linear infinite}@keyframes scan{to{transform:translateX(1700px)}}.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 4.4s ease-out infinite}@keyframes ring{0%{opacity:.8;transform:scale(.4)}60%,100%{opacity:0;transform:scale(1.7)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity:.2}}.breathe{animation:breathe 3.2s ease-in-out infinite}@keyframes breathe{50%{opacity:.45}}.draw{animation:draw 1.6s cubic-bezier(.2,.7,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.7,.2,1) forwards}@keyframes grow{to{transform:scaleX(1)}}.caret{opacity:0;animation:caret 1s steps(2) infinite 2.6s}@keyframes caret{to{opacity:1}}.draft{animation:dash 6s linear infinite}@keyframes dash{to{stroke-dashoffset:-110}}.c1{animation:c1 9s infinite}@keyframes c1{0%,3%{opacity:0}8%,26%{opacity:1}30%,100%{opacity:0}}.c2{animation:c2 9s infinite}@keyframes c2{0%,30%{opacity:0;transform:translateY(8px)}36%,100%{opacity:1;transform:none}}.c3{animation:c3 9s infinite}@keyframes c3{0%,44%{opacity:0}50%,100%{opacity:1}}.dot{animation:bo 1s ease-in-out infinite}@keyframes bo{50%{transform:translateY(-4px)}}.ap{animation:ap 2s ease-in-out infinite}@keyframes ap{50%{opacity:.75}}</style><rect x=".5" y=".5" width="1199" height="329" rx="18" fill="#FBFCFF" stroke="#E2E7F1"/><path d="M40 .5H420" stroke="url(#gf)" stroke-width="2"/><g clip-path="url(#pc)"><ellipse cx="1059" cy="298" rx="321" ry="107" fill="#7C3AED" opacity="0.14" class="dr1" filter="url(#bl)"/><ellipse cx="699" cy="142" rx="268" ry="112" fill="#0891B2" opacity="0.10" class="dr2" filter="url(#bl)"/><ellipse cx="267" cy="149" rx="224" ry="144" fill="#DB2777" opacity="0.09" class="dr3" filter="url(#bl)"/><ellipse cx="87" cy="42" rx="294" ry="141" fill="#2563EB" opacity="0.11" class="dr1" filter="url(#bl)"/><circle cx="615" cy="242" r="1.4" fill="#1E293B" opacity=".45" class="tw" style="animation-delay:-3.1s;animation-duration:2.9s"/><circle cx="42" cy="122" r="1" fill="#1E293B" opacity=".45" class="tw" style="animation-delay:-2.5s;animation-duration:4.9s"/><circle cx="435" cy="251" r="1.4" fill="#1E293B" opacity=".45" class="tw" style="animation-delay:-3.9s;animation-duration:3.1s"/><circle cx="1170" cy="1