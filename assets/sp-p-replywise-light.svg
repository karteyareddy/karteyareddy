><text x="54" y="128" class="s" font-size="50" font-weight="700" fill="url(#g)" letter-spacing="-.5" filter="url(#soft)" opacity=".7">ReplyWise Local</text><text x="54" y="128" class="s" font-size="50" font-weight="700" fill="#0E1325" letter-spacing="-.5">ReplyWise Local</text></g><g class="up" style="animation-delay:.35s"><text x="56" y="174" class="s" font-size="23" fill="#3F4862">A local-first WhatsApp CRM that drafts replies with</text><text x="56" y="207" class="s" font-size="23" fill="#3F4862">per-contact memory, and sends nothing until you approve it.</text></g><g class="up" style="animation-delay:0.60s"><rect x="56.0" y="262" width="86.1" height="34" rx="17.0" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1"/><text x="99.1" y="285.1" class="s" font-size="17" fill="#3F4862" text-anchor="middle">Node.js</text></g><g class="up" style="animation-delay:0.68s"><rect x="152.1" y="262" width="91.1" height="34" rx="17.0" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1"/><text x="197.6" y="285.1" class="s" font-size="17" fill="#3F4862" text-anchor="middle">Express</text></g><g class="up" style="animation-delay:0.76s"><rect x="253.2" y="262" width="158.2" height="34" rx="17.0" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1"/><text x="332.3" y="285.1" class="s" font-size="17" fill="#3F4862" text-anchor="middle">whatsapp-web.js</text></g><g class="up" style="animation-delay:0.84s"><rect x="421.4" y="262" width="125.3" height="34" rx="17.0" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1"/><text x="484.0" y="285.1" class="s" font-size="17" fill="#3F4862" text-anchor="middle">Gemini / Groq</text></g><g class="up" style="animation-delay:0.92s"><rect x="556.7" y="262" width="82.1" height="34" rx="17.0" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1"/><text x="597.7" y="285.1" class="s" font-size="17" fill="#3F4862" text-anchor="middle">Docker</text></g><path d="M760 40 V290" stroke="#E2E7F1"/><rect x="790" y="62" width="230" height="46" rx="16" fill="#FFFFFF" stroke="#C9D2E3"/><text x="810" y="91" class="s" font-size="16" fill="#3F4862">Can we move it to 6 pm?</text><g class="c1"><rect x="892" y="136" width="78" height="40" rx="14" fill="#FFFFFF" stroke="#C9D2E3"/><circle cx="912" cy="156" r="4" fill="#3F4862" class="dot" style="animation-delay:0.00s"/><circle cx="926" cy="156" r="4" fill="#3F4862" class="dot" style="animation-delay:0.15s"/><circle cx="940" cy="156" r="4" fill="#3F4862" class="dot" style="animation-delay:0.30s"/></g><g class="c2"><rect x="880" y="128" width="262" height="76" rx="16" fill="#FFFFFF" stroke="url(#ga)" stroke-width="1.8" stroke-dasharray="6 5" class="draft"/><text x="900" y="156" class="m" font-size="12" fill="#0891B2" letter-spacing="2">AI DRAFT · MEMORY ON</text><text x="900" y="184" class="s" font-size="16" fill="#0E1325">Sure — 6 pm works. See you then.</text></g><g class="c3"><rect x="960" y="222" width="96" height="34" rx="17" fill="url(#ga)" filter="url(#ng)" class="ap"/><text x="1008" y="244" class="s" font-size="15" font-weight="700" fill="#FBFCFF" text-anchor="middle">Approve</text><rect x="1066" y="222" width="76" height="34" rx="17" fill="none" stroke="#C9D2E3"/><text x="1104" y="244" class="s" font-size="15" fill="#3F4862" text-anchor="middle">Edit</text></g><text x="1142" y="290" class="m" font-size="13" fill="#5F6A85" text-anchor="end">nothing sends without a human</text></svg>
