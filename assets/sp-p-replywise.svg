<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t"><title id="t">ReplyWise Local — A local-first WhatsApp CRM that drafts replies with per-contact memory, and sends nothing until you approve it. Built with Node.js, Express, whatsapp-web.js, Gemini / Groq, Docker.</title><defs><linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="780" y1="0" x2="1150" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#4F7DFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="gf" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="420" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#4F7DFF"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient><radialGradient id="glow" cx="980" cy="160" r="360" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4F7DFF" stop-opacity=".13"/><stop offset="1" stop-color="#4F7DFF" stop-opacity="0"/></radialGradient></defs><style>.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.draft{animation:dash 6s linear infinite}@keyframes dash{to{stroke-dashoffset:-110}}</style><rect x=".5" y=".5" width="1199" height="329" rx="18" fill="#0A0C10" stroke="#1E2633"/><path d="M40 .5H420" stroke="url(#gf)" stroke-width="2"/><rect x="1" y="1" width="1198" height="328" rx="18" fill="url(#glow)"/><text x="56" y="70" class="m" font-size="15" letter-spacing="3" fill="#22D3EE" font-weight="700">P/03<tspan dx="14" fill="#5D6678">LLMS × MESSAGING</tspan></text><text x="54" y="128" class="s" font-size="50" font-weight="700" fill="#E8ECF4" letter-spacing="-.5">ReplyWise Local</text><text x="56" y="174" class="s" font-size="23" fill="#9AA3B5">A local-first WhatsApp CRM that drafts replies with</text><text x="56" y="207" class="s" font-size="23" fill="#9AA3B5">per-contact memory, and sends nothing until you approve it.</text><rect x="56.0" y="262" width="86.1" height="34" rx="17.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="99.1" y="285.1" class="s" font-size="17" fill="#9AA3B5" text-anchor="middle">Node.js</text><rect x="152.1" y="262" width="91.1" height="34" rx="17.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="197.6" y="285.1" class="s" font-size="17" fill="#9AA3B5" text-anchor="middle">Express</text><rect x="253.2" y="262" width="158.2" height="34" rx="17.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="332.3" y="285.1" class="s" font-size="17" fill="#9AA3B5" text-anchor="middle">whatsapp-web.js</text><rect x="421.4" y="262" width="125.3" height="34" rx="17.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="484.0" y="285.1" class="s" font-size="17" fill="#9AA3B5" text-anchor="middle">Gemini / Groq</text><rect x="556.7" y="262" width="82.1" height="34" rx="17.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="597.7" y="285.1" class="s" font-size="17" fill="#9AA3B5" text-anchor="middle">Docker</text><path d="M760 40 V290" stroke="#1E2633"/><rect x="790" y="62" width="230" height="46" rx="16" fill="#11151D" stroke="#2A3446"/><text x="810" y="91" class="s" font-size="16" fill="#9AA3B5">Can we move it to 6 pm?</text><rect x="880" y="128" width="262" height="76" rx="16" fill="none" stroke="url(#ga)" stroke-width="1.8" stroke-dasharray="6 5" class="draft"/><text x="900" y="156" class="m" font-size="12" fill="#22D3EE" letter-spacing="2">AI DRAFT · MEMORY ON</text><text x="900" y="184" class="s" font-size="16" fill="#E8ECF4">Sure — 6 pm works. See you then.</text><rect x="960" y="222" width="96" height="34" rx="17" fill="url(#ga)"/><text x="1008" y="244" class="s" font-size="15" font-weight="700" fill="#0A0C10" text-anchor="middle">Approve</text><rect x="1066" y="222" width="76" height="34" rx="17" fill="none" stroke="#2A3446"/><text x="1104" y="244" class="s" font-size="15" fill="#9AA3B5" text-anchor="middle">Edit</text><text x="1142" y="290" class="m" font-size="13" fill="#5D6678" text-anchor="end">nothing sends without a human</text></svg>
