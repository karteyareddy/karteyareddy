</text><text x="40" y="285" class="s" font-size="23" fill="#9AA3B5">confidence drops.</text><rect x="40.0" y="326" width="93.0" height="36" rx="18.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="86.5" y="350.8" class="s" font-size="19" fill="#9AA3B5" text-anchor="middle">Next.js</text><rect x="143.0" y="326" width="107.6" height="36" rx="18.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="196.7" y="350.8" class="s" font-size="19" fill="#9AA3B5" text-anchor="middle">MediaPipe</text><rect x="260.5" y="326" width="98.5" height="36" rx="18.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="309.7" y="350.8" class="s" font-size="19" fill="#9AA3B5" text-anchor="middle">FastAPI</text><rect x="369.0" y="326" width="98.5" height="36" rx="18.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="418.2" y="350.8" class="s" font-size="19" fill="#9AA3B5" text-anchor="middle">PyTorch</text><rect x="40.0" y="372" width="108.6" height="36" rx="18.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="94.3" y="396.8" class="s" font-size="19" fill="#9AA3B5" text-anchor="middle">Supabase</text><path d="M40 412 H560" stroke="#1E2633"/><g transform="translate(-666 392)"><path d="M930 262 L890 239" stroke="#2A3446" stroke-width="3"/><path d="M890 239 L863 207" stroke="#2A3446" stroke-width="3"/><path d="M863 207 L846 176" stroke="#2A3446" stroke-width="3"/><path d="M846 176 L833 149" stroke="#2A3446" stroke-width="3"/><path d="M930 262 L903 165" stroke="#2A3446" stroke-width="3"/><path d="M903 165 L896 119" stroke="#2A3446" stroke-width="3"/><path d="M896 119 L893 90" stroke="#2A3446" stroke-width="3"/><path d="M893 90 L891 65" stroke="#2A3446" stroke-width="3"/><path d="M903 165 L930 159" stroke="#2A3446" stroke-width="3"/><path d="M930 159 L930 109" stroke="#2A3446" stroke-width="3"/><path d="M930 109 L930 75" stroke="#2A3446" stroke-width="3"/><path d="M930 75 L930 48" stroke="#2A3446" stroke-width="3"/><path d="M930 159 L955 165" str