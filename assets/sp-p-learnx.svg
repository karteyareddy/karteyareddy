<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t"><title id="t">LearnX — An AI learning platform that maps topics into a knowledge graph, generates quizzes on the fly and personalises each learner's path. Built with Next.js, TypeScript, Supabase, Tailwind CSS, Gemini API.</title><defs><clipPath id="pc"><rect x="1" y="1" width="1198" height="328" rx="18"/></clipPath><filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter><filter id="ng" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" opacity=".06"/></pattern><linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".045"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="54" y1="0" x2="700" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#00E5FF"/><stop offset="0.35" stop-color="#4C8DFF"/><stop offset="0.7" stop-color="#A855F7"/><stop offset="1" stop-color="#FF3DA6"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;323 0;0 0" dur="7s" repeatCount="indefinite"/></linearGradient><linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="780" y1="0" x2="1150" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#00E5FF"/><stop offset="0.35" stop-color="#4C8DFF"/><stop offset="0.7" stop-color="#A855F7"/><stop offset="1" stop-color="#FF3DA6"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;185 0;0