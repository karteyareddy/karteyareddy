frames blink{50%{opacity:.2}}.breathe{animation:breathe 3.2s ease-in-out infinite}@keyframes breathe{50%{opacity:.45}}.draw{animation:draw 1.6s cubic-bezier(.2,.7,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.7,.2,1) forwards}@keyframes grow{to{transform:scaleX(1)}}.caret{opacity:0;animation:caret 1s steps(2) infinite 2.6s}@keyframes caret{to{opacity:1}}.wave{stroke-dasharray:14 10;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-48}}.sig{animation:sig 3s steps(1) infinite}@keyframes sig{0%{fill:#0891B2}33%{fill:#D97706}66%{fill:#DB2777}}</style><rect x=".5" y=".5" width="1199" height="329" rx="18" fill="#FBFCFF" stroke="#E2E7F1"/><path d="M40 .5H420" stroke="url(#gf)" stroke-width="2"/><g clip-path="url(#pc)"><ellipse cx="238" cy="221" rx="283" ry="146" fill="#7C3AED" opacity="0.14" class="dr1" filter="url(#bl)"/><ellipse cx="293" cy="252" rx="308" ry="150" fill="#0891B2" opacity="0.10" class="dr2" filter="url(#bl)"/><ellipse cx="605" cy="87" rx="192" ry="136" fill="#DB2777" opacity="0.09" class="dr3" filter="url(#bl)"/><ellipse cx="692" cy="37" rx="306" ry="122" fill="#2563EB" opacity="0.11" class="dr1" filter="url(#bl)"/><circle cx="279" cy="14" r="1.8" fill="#1E293B" opacity=".45" class="tw" style="animation-delay:-2.5s;animation-duration:2.5s"/><circle cx="395" cy="164" r="1" fill="#1E293B" opacity=".45" class="tw" style="animation-delay:-2.6s;animation-duration:4.8s"/><circle cx="28" cy="245" r="1" fill="#1E293B" opacity=".45" class="tw" style="animation-delay:-0.5s;animation-duration:4.8s"/><circle cx="544" cy="182" r="1.4" fill="#1E293B" opacity=".45" class="tw" style="animation-delay:-1.6s;animation-duration:2.8s"/><circle cx="798" cy="155" r="1" fill="#1E293B" opacity=".45" class="tw" style="animation-delay:-0.3s;animation-duration:2.9s"/><circle cx="809" cy="265" r="1" fill="#1E293B" opacity=".45" class="tw" style="