-size="23" fill="#B4BDD0">A Deaf-first Indian Sign Language network: QR access points,</text><text x="56" y="207" class="s" font-size="23" fill="#B4BDD0">offline phrase packs, and sign recognition that hands off to</text><text x="56" y="240" class="s" font-size="23" fill="#B4BDD0">a human when confidence drops.</text></g><g class="up" style="animation-delay:0.60s"><rect x="56.0" y="262" width="86.1" height="34" rx="17.0" fill="#0F131C" stroke="#2B3650" stroke-width="1"/><text x="99.1" y="285.1" class="s" font-size="17" fill="#B4BDD0" text-anchor="middle">Next.js</text></g><g class="up" style="animation-delay:0.68s"><rect x="152.1" y="262" width="99.2" height="34" rx="17.0" fill="#0F131C" stroke="#2B3650" stroke-width="1"/><text x="201.7" y="285.1" class="s" font-size="17" fill="#B4BDD0" text-anchor="middle">MediaPipe</text></g><g class="up" style="animation-delay:0.76s"><rect x="261.3" y="262" width="91.1" height="34" rx="17.0" fill="#0F131C" stroke="#2B3650" stroke-width="1"/><text x="306.8" y="285.1" class="s" font-size="17" fill="#B4BDD0" text-anchor="middle">FastAPI</text></g><g class="up" style="animation-delay:0.84s"><rect x="362.4" y="262" width="91.1" height="34" rx="17.0" fill="#0F131C" stroke="#2B3650" stroke-width="1"/><text x="407.9" y="285.1" class="s" font-size="17" fill="#B4BDD0" text-anchor="middle">PyTorch</text></g><g class="up" style="animation-delay:0.92s"><rect x="463.4" y="262" width="100.1" height="34" rx="17.0" fill="#0F131C" stroke="#2B3650" stroke-width="1"/><text x="513.5" y="285.1" class="s" font-size="17" fill="#B4BDD0" text-anchor="middle">Supabase</text></g><path d="M760 40 V290" stroke="#1C2433"/><path d="M930 262 L890 239" stroke="#2B3650" stroke-width="3"/><path d="M890 239 L863 207" stroke="#2B3650" stroke-width="3"/><path d="M863 207 L846 176" stroke="#2B3650" stroke-width="3"/><path d="M846 176 L833 149" stroke="#2B3650" stroke-width="3"/><path d="M930 262 L903 165" stroke="#2B3650" stroke-width="3"/><path d="M903 165 L896 119" s