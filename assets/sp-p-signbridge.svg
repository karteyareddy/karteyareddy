guage network: QR access points,</text><text x="56" y="207" class="s" font-size="23" fill="#9AA3B5">offline phrase packs, and sign recognition that hands off to</text><text x="56" y="240" class="s" font-size="23" fill="#9AA3B5">a human when confidence drops.</text><rect x="56.0" y="262" width="86.1" height="34" rx="17.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="99.1" y="285.1" class="s" font-size="17" fill="#9AA3B5" text-anchor="middle">Next.js</text><rect x="152.1" y="262" width="99.2" height="34" rx="17.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="201.7" y="285.1" class="s" font-size="17" fill="#9AA3B5" text-anchor="middle">MediaPipe</text><rect x="261.3" y="262" width="91.1" height="34" rx="17.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="306.8" y="285.1" class="s" font-size="17" fill="#9AA3B5" text-anchor="middle">FastAPI</text><rect x="362.4" y="262" width="91.1" height="34" rx="17.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="407.9" y="285.1" class="s" font-size="17" fill="#9AA3B5" text-anchor="middle">PyTorch</text><rect x="463.4" y="262" width="100.1" height="34" rx="17.0" fill="#11151D" stroke="#2A3446" stroke-width="1"/><text x="513.5" y="285.1" class="s" font-size="17" fill="#9AA3B5" text-anchor="middle">Supabase</text><path d="M760 40 V290" stroke="#1E2633"/><path d="M930 262 L890 239" stroke="#2A3446" stroke-width="3"/><path d="M890 239 L863 207" stroke="#2A3446" stroke-width="3"/><path d="M863 207 L846 176" stroke="#2A3446" stroke-width="3"/><path d="M846 176 L833 149" stroke="#2A3446" stroke-width="3"/><path d="M930 262 L903 165" stroke="#2A3446" stroke-width="3"/><path d="M903 165 L896 119" stroke="#2A3446" stroke-width="3"/><path d="M896 119 L893 90" stroke="#2A3446" stroke-width="3"/><path d="M893 90 L891 65" stroke="#2A3446" stroke-width="3"/><path d="M903 165 L930 159" stroke="#2A3446" stroke-width="3"/><path d="M930 159 L930 109" stroke="#2A3446" stroke-width="3"/><path d="M930 1