<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t"><title id="t">SignBridge India — A Deaf-first Indian Sign Language network: QR access points, offline phrase packs, and sign recognition that hands off to a human when confidence drops. Built with Next.js, MediaPipe, FastAPI, PyTorch, Supabase.</title><defs><clipPath id="pc"><rect x="1" y="1" width="1198" height="328" rx="18"/></clipPath><filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter><filter id="ng" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" opacity=".06"/></pattern><linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".045"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="54" y1="0" x2="700" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#00E5FF"/><stop offset="0.35" stop-color="#4C8DFF"/><stop offset="0.7" stop-color="#A855F7"/><stop offset="1" stop-color="#FF3DA6"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;323 0;0 0" dur="7s" repeatCount="indefinite"/></linearGradient><linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="780" y1="0" x2="1150" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#00E5FF"/><stop offset="0.35" stop-color="#4C8DFF"/><stop offset="0.7" stop-color="#A855F7"/><stop offset="1" stop-color="#FF3DA6"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;185 0;0 0" dur="7s" repeatCount="indefinite"/></linearGradient><linearGradient id="gc" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="740" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="0.35" stop-color="#4C8DFF"/><stop offset="0.7" stop-color="#A855F7"/><stop offset="1" stop-color="#FF3DA6"/></linearGradient><linearGradient id="gf" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="420" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="0.35" stop-color="#4C8DFF"/><stop offset="0.7" stop-color="#A855F7"/><stop offset="1" stop-color="#FF3DA6" stop-opacity="0"/></linearGradient></defs><style>.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.08}50%{opacity:.85}}.dr1,.dr2,.dr3{transform-box:fill-box;transform-origin:center}.dr1{animation:dr1 16s ease-in-out infinite alternate}@keyframes dr1{to{transform:translate(110px,50px) scale(1.2)}}.dr2{animation:dr2 21s ease-in-out infinite alternate}@keyframes dr2{to{transform:translate(-140px,40px) scale(1.1)}}.dr3{animation:dr3 18s ease-in-out infinite alternate}@keyframes dr3{to{transform:translate(70px,-70px) scale(.85)}}.scan{animation:scan 7s linear infinite}@keyframes scan{to{transform:translateX(1700px)}}.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 4.4s ease-out infinite}@keyframes ring{0%{opacity:.8;transform:scale(.4)}60%,100%{opacity:0;transform:scale(1.7)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity:.2}}.breathe{animation:breathe 3.2s ease-in-out infinite}@keyframes breathe{50%{opacity:.45}}.draw{animation:draw 1.6s cubic-bezier(.2,.7,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.7,.2,1) forwards}@keyframes grow{to{transform:scaleX(1)}}.caret{opacity:0;animation:caret 1s steps(2) infinite 2.6s}@keyframes caret{to{opacity:1}}.lm{animation:lm 3.2s ease-in-out infinite}@keyframes lm{50%{opacity:.35}}.beam{animation:beam 4s ease-in-out infinite}@keyframes beam{to{transform:translateY(330px)}}</style><rect x=".5" y=".5" width="1199" height="329" rx="18" fill="#06080D" stroke="#1C2433"/><path d="M40 .5H420" stroke="url(#gf)" stroke-width="2"/><g clip-path="url(#pc)"><ellipse cx="1095" cy="58" rx="195" ry="198" fill="#A855F7" opacity="0.26" class="dr1" filter="url(#bl)"/><ellipse cx="259" cy="52" rx="286" ry="133" fill="#00E5FF" opacity="0.18" class="dr2" filter="url(#bl)"/><ellipse cx="1021" cy="85" rx="330" ry="131" fill="#FF3DA6" opacity="0.16" class="dr3" filter="url(#bl)"/><ellipse cx="709" cy="293" rx="291" ry="190" fill="#4C8DFF" opacity="0.19" class="dr1" filter="url(#bl)"/><circle cx="850" cy="16" r="1" fill="#FFFFFF" opacity="1" class="tw" style="animation-delay:-2.4s;animation-duration:3.2s"/><circle cx="228" cy="280" r="1" fill="#FFFFFF" opacity="1" class="tw" style="animation-delay:-2.8s;animation-duration:4.0s"/><circle cx="310" cy="316" r="1.4" fill="#FFFFFF" opacity="1" class="tw" style="animation-delay:-3.6s;animation-duration:4.7s"/><circle cx="1147" cy="170" r="1.4" fill="#FFFFFF" opacity="1" class="tw" style="animation-delay:-3.3s;animation-duration:4.1s"/><circle cx="222" cy="16" r="1" fill="#FFFFFF" opacity="1" class="tw" style="animation-delay:-1.7s;animation-duration:3.1s"/><circle cx="341" cy="291" r="1.8" fill="#FFFFFF" opacity="1" class="tw" style="animation-delay:-2.6s;animation-duration:4