<svg xmlns="http://www.w3.org/2000/svg" width="600" height="709" viewBox="0 0 600 709" role="img" aria-labelledby="t"><title id="t">Q-TrafficX — A weather-aware traffic digital twin that turns signal timing into QUBO problems and solves them with QAOA, benchmarked against classical solvers. Built with Python, Qiskit Aer, FastAPI, NetworkX, Next.js.</title><defs><clipPath id="pc"><rect x="1" y="1" width="598" height="707" rx="18"/></clipPath><filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter><filter id="ng" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#1E293B" opacity=".09"/></pattern><linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E293B" stop-opacity="0"/><stop offset=".5" stop-color="#1E293B" stop-opacity=".045"/><stop offset="1" stop-color="#1E293B" stop-opacity="0"/></linearGradient><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="38" y1="0" x2="560" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#0891B2"/><stop offset="0.35" stop-color="#2563EB"/><stop offset="0.7" stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;261 0;0 0" dur="7s" repeatCount="indefinite"/></linearGradient><linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="780" y1="0" x2="1150" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#0891B2"/><stop offset="0.35" stop-color="#2563EB"/><stop offset="0.7" stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;