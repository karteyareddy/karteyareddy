l-box;transform-origin:center}.dr1{animation:dr1 16s ease-in-out infinite alternate}@keyframes dr1{to{transform:translate(110px,50px) scale(1.2)}}.dr2{animation:dr2 21s ease-in-out infinite alternate}@keyframes dr2{to{transform:translate(-140px,40px) scale(1.1)}}.dr3{animation:dr3 18s ease-in-out infinite alternate}@keyframes dr3{to{transform:translate(70px,-70px) scale(.85)}}.scan{animation:scan 7s linear infinite}@keyframes scan{to{transform:translateX(1700px)}}.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 4.4s ease-out infinite}@keyframes ring{0%{opacity:.8;transform:scale(.4)}60%,100%{opacity:0;transform:scale(1.7)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity:.2}}.breathe{animation:breathe 3.2s ease-in-out infinite}@keyframes breathe{50%{opacity:.45}}.draw{animation:draw 1.6s cubic-bezier(.2,.7,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.7,.2,1) forwards}@keyframes grow{to{transform:scaleX(1)}}.caret{opacity:0;animation:caret 1s steps(2) infinite 2.6s}@keyframes caret{to{opacity:1}}</style><path d="M40 0 V60 Q40 84 64 84 H560" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="700" stroke-dashoffset="700" class="draw"/><circle cx="572" cy="84" r="9" fill="none" stroke="#A855F7" stroke-width="2.5"/><circle cx="572" cy="84" r="3.5" fill="#A855F7" class="blink" filter="url(#ng)"/><circle r="2.5" fill="#00E5FF" filter="url(#ng)"><animateMotion dur="3s" repeatCount="indefinite" path="M590 84 A18 18 0 1 1 554 84 A18 18 0 1 1 590 84"/></circle><g class="up" style="animation-delay:.8s"><text x="600" y="78" class="s" font-size="30" font-weight="600" fill="url(#gt)">Still training. Always shipping.</text><text x="600" y="78" class="s" font-size="30